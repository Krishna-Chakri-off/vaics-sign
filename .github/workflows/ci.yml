name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: vaics, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: vaics_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    defaults: {run: {working-directory: backend}}
    env:
      DATABASE_URL: postgresql+psycopg2://vaics:ci-only@localhost:5432/vaics_test
      TEST_DATABASE_URL: postgresql+psycopg2://vaics:ci-only@localhost:5432/vaics_test
      SECRET_KEY: ci-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest -q
      - run: TEST_DATABASE_URL= pytest -q   # SQLite pass too
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
