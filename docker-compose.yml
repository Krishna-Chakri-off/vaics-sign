# Local / demo stack. Secrets come from .env (copy backend/.env.example). Nothing here is production-hardened.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vaics_sign}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaics}"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-vaics}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vaics_sign}
      AUTO_CREATE_TABLES: "false"
      STORAGE_DIR: /data/storage
      RUN_SCHEDULER: "true"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:8080}
    volumes: [storage:/data/storage]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

  # Optional: S3-compatible storage (set STORAGE_BACKEND=s3, S3_ENDPOINT_URL=http://minio:9000)
  minio:
    image: minio/minio:latest
    profiles: [s3]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  # Optional: malware scanning (set CLAMD_HOST=clamav)
  clamav:
    image: clamav/clamav:stable
    profiles: [av]

volumes: {pgdata: {}, storage: {}, minio: {}}
